[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

[Variables]
ConnectedColor=0,0,255,255
DisconnectedColor=0,0,0,255

; --- Why this is not a single ICMP ping ---
; The old skin pinged 8.8.8.8 only. Measured on this network, ICMP to public
; resolvers failed 4 times in 60 cycles while HTTP was fine the whole time -
; carriers deprioritise and rate-limit ICMP, so it drops first under load.
; Two independent targets are used, and the icon only goes "disconnected"
; when BOTH fail. That matches how the router's own wan-check decides.
;
; The Ping plugin returns round-trip time in MILLISECONDS, not 1/0.
; A timeout returns the TimeoutValue below. So the test is "< 30000",
; not "= 1" as the old skin had it (which was only ever true at exactly 1ms).

[MeasurePing1]
Measure=Plugin
Plugin=Ping
Address=1.1.1.1
UpdateDivider=5
TimeoutValue=30000

[MeasurePing2]
Measure=Plugin
Plugin=Ping
Address=8.8.8.8
UpdateDivider=5
TimeoutValue=30000

; Online if EITHER responds. Both must time out to show disconnected.
[MeasureOnline]
Measure=Calc
Formula=(MeasurePing1 < 30000) || (MeasurePing2 < 30000)
UpdateDivider=5
IfCondition=MeasureOnline = 1
; The tint must be set on the [Image] METER. The old skin targeted
; #CURRENTSECTION#, which resolved to the measure itself, so the tint was
; never applied and the icon stayed permanently on DisconnectedColor.
IfTrueAction=[!SetOption Image ImageTint "#ConnectedColor#"][!UpdateMeter Image][!Redraw]
IfFalseAction=[!SetOption Image ImageTint "#DisconnectedColor#"][!UpdateMeter Image][!Redraw]

[Image]
Meter=Image
ImageName=internet_symbol.png
ImageTint=#DisconnectedColor#
W=100
H=100
DynamicVariables=1
