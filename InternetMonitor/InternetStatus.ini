[MeterProbeLabel]
Meter=String
MeterStyle=sLabel
X=#Pad#
Y=(216 - #BannerGap#)
Text="Success"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterProbeValue]
Meter=String
MeterStyle=sValue
X=(#W# - #Pad#)
Y=(214 - #BannerGap#)
W=120
H=14
StringAlign=Right
FontSize=8.5
Text="[MeasureProbeOk] ok / [MeasureProbeFail] bad"
Hidden=(#Expanded# = 0 ? 1 : 0)
