[Rainmeter]
Update=1000
AccurateText=1
MouseOverAction=[!SetVariable Expanded 1][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Expanded 0][!UpdateMeter *][!Redraw]

;---------------------------------------------------
; VARIABLES
;---------------------------------------------------
[Variables]
Expanded=0

HealthURL=http://192.168.88.210:5678/webhook/net-health.json
PingTarget=1.1.1.1
FibreGateway=192.168.1.1
LteGateway=192.168.0.1

PingWarning=100
PingTimeout=3000
RetryWarn=10

; Palette — UniFi-ish: near-black panel, restrained accents
ColorText=238,241,246
ColorDim=138,146,161
ColorFaint=90,97,110
ColorGood=64,214,133
ColorWarn=246,184,68
ColorBad=242,92,92
ColorRule=255,255,255,18
ColorPanel=15,17,22,238
ColorTrack=255,255,255,12
ColorFibre=104,184,255
ColorLte=198,142,255

; Geometry
W=236
Pad=14
Inner=208

;---------------------------------------------------
; STYLES
;---------------------------------------------------
[sMicro]
FontFace=Segoe UI
FontSize=7
FontColor=#ColorFaint#
StringCase=Upper
StringStyle=Bold
AntiAlias=1
ClipString=1

[sLabel]
FontFace=Segoe UI
FontSize=7.5
FontColor=#ColorDim#
StringCase=Upper
StringStyle=Bold
AntiAlias=1
ClipString=1

[sValue]
FontFace=Segoe UI
FontSize=9
FontColor=#ColorText#
AntiAlias=1
ClipString=1

[sStatus]
FontFace=Segoe UI
FontSize=10
FontWeight=600
FontColor=#ColorText#
AntiAlias=1
ClipString=1

[sWan]
FontFace=Segoe UI
FontSize=17
FontWeight=700
FontColor=#ColorFibre#
AntiAlias=1
ClipString=1

;---------------------------------------------------
; MEASURES — latency, loss, jitter
;---------------------------------------------------
[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
UpdateRate=2
DestAddress=#PingTarget#
Timeout=#PingTimeout#
IfCondition=(MeasurePing >= 0) && (MeasurePing < #PingWarning#)
IfTrueAction=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterStatus Text "Online"][!ShowMeter MeterPing][!HideMeter MeterPingNA][!UpdateMeter *][!Redraw]
IfCondition2=(MeasurePing >= #PingWarning#) && (MeasurePing < #PingTimeout#)
IfTrueAction2=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorWarn# | StrokeWidth 0"][!SetOption MeterStatus Text "Degraded"][!ShowMeter MeterPing][!HideMeter MeterPingNA][!UpdateMeter *][!Redraw]
IfCondition3=(MeasurePing < 0) || (MeasurePing >= #PingTimeout#)
IfTrueAction3=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterStatus Text "Offline"][!HideMeter MeterPing][!ShowMeter MeterPingNA][!UpdateMeter *][!Redraw]
DynamicVariables=1

[MeasurePingPrev]
Measure=Calc
Formula=MeasurePing
UpdateDivider=1

; Jitter = mean absolute delta between consecutive samples
[MeasureJitterRaw]
Measure=Calc
Formula=Abs(MeasurePing - MeasurePingPrev)
DynamicVariables=1

[MeasureJitter]
Measure=Calc
Formula=MeasureJitterRaw
AverageSize=20
DynamicVariables=1

[MeasureLossRaw]
Measure=Calc
Formula=(MeasurePing < 0 || MeasurePing >= #PingTimeout# ? 1 : 0)
DynamicVariables=1

[MeasureLoss]
Measure=Calc
Formula=MeasureLossRaw
AverageSize=60
MaxValue=60
Percentual=1
DynamicVariables=1

;---------------------------------------------------
; MEASURES — both WAN links
;---------------------------------------------------
[MeasureFibreGw]
Measure=Plugin
Plugin=PingPlugin
UpdateRate=10
DestAddress=#FibreGateway#
Timeout=2000
IfCondition=(MeasureFibreGw >= 0) && (MeasureFibreGw < 2000)
IfTrueAction=[!SetOption MeterWan1Dot Shape "Ellipse 3,3,3 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterWan1State Text "online"][!UpdateMeter *][!Redraw]
IfCondition2=(MeasureFibreGw < 0) || (MeasureFibreGw >= 2000)
IfTrueAction2=[!SetOption MeterWan1Dot Shape "Ellipse 3,3,3 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterWan1State Text "down"][!UpdateMeter *][!Redraw]
DynamicVariables=1

[MeasureLteGw]
Measure=Plugin
Plugin=PingPlugin
UpdateRate=10
DestAddress=#LteGateway#
Timeout=2000
IfCondition=(MeasureLteGw >= 0) && (MeasureLteGw < 2000)
IfTrueAction=[!SetOption MeterWan2Dot Shape "Ellipse 3,3,3 | Fill Color #ColorFaint# | StrokeWidth 0"][!SetOption MeterWan2State Text "ready"][!UpdateMeter *][!Redraw]
IfCondition2=(MeasureLteGw < 0) || (MeasureLteGw >= 2000)
IfTrueAction2=[!SetOption MeterWan2Dot Shape "Ellipse 3,3,3 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterWan2State Text "down"][!UpdateMeter *][!Redraw]
DynamicVariables=1

;---------------------------------------------------
; MEASURES — aggregated health (router route + Pi-hole)
;---------------------------------------------------
[MeasureHealth]
Measure=Plugin
Plugin=WebParser
URL=#HealthURL#
RegExp=(?siU)"link":"(.*)".*"status":"(.*)".*"dns_blocked_pct":(.*),.*"dns_qps":(.*),.*"dns_retry_pct":(.*),.*"hist":"(.*)".*"h0":"(.)".*"h1":"(.)".*"h2":"(.)".*"h3":"(.)".*"h4":"(.)".*"h5":"(.)".*"h6":"(.)".*"h7":"(.)".*"h8":"(.)".*"h9":"(.)".*"h10":"(.)".*"h11":"(.)".*"h12":"(.)".*"h13":"(.)".*"h14":"(.)".*"h15":"(.)".*"h16":"(.)".*"h17":"(.)".*"h18":"(.)".*"h19":"(.)"
UpdateRate=20
ForceReload=1

[MeasureLink]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=1
IfMatch=Fibre
IfMatchAction=[!SetOption MeterWan Text "FIBRE"][!SetOption MeterWan FontColor "#ColorFibre#"][!SetOption MeterWanMark Shape "Rectangle 0,0,3,19,1.5 | Fill Color #ColorFibre# | StrokeWidth 0"][!SetOption MeterGraph LineColor "#ColorFibre#,200"][!UpdateMeter *][!Redraw]
IfMatch2=LTE
IfMatchAction2=[!SetOption MeterWan Text "LTE"][!SetOption MeterWan FontColor "#ColorLte#"][!SetOption MeterWanMark Shape "Rectangle 0,0,3,19,1.5 | Fill Color #ColorLte# | StrokeWidth 0"][!SetOption MeterGraph LineColor "#ColorLte#,200"][!UpdateMeter *][!Redraw]

[MeasureLinkNote]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=2

[MeasureDnsBlocked]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=3

[MeasureDnsQps]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=4

[MeasureDnsRetry]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=5
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureDnsRetryNum]
Measure=Calc
Formula=[MeasureDnsRetry]
DynamicVariables=1
IfCondition=MeasureDnsRetryNum >= #RetryWarn#
IfTrueAction=[!SetOption MeterDnsFlag Text "retries elevated"][!SetOption MeterDnsFlag FontColor "#ColorWarn#"][!UpdateMeter *][!Redraw]
IfCondition2=MeasureDnsRetryNum < #RetryWarn#
IfTrueAction2=[!SetOption MeterDnsFlag Text "healthy"][!SetOption MeterDnsFlag FontColor "#ColorGood#"][!UpdateMeter *][!Redraw]

;---------------------------------------------------
; MEASURES — throughput
;---------------------------------------------------
[MeasureNetIn]
Measure=NetIn
Interface=Best
AverageSize=3

[MeasureNetOut]
Measure=NetOut
Interface=Best
AverageSize=3

[RunInternetBatchFile]
Measure=Plugin
Plugin=RunCommand
Parameter="#CURRENTPATH#InternetController.bat"
OutputType=ANSI
State=Hide

