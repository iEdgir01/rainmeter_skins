; --- latency: this PC's path, with its numbers then a sparkline ---
; Deliberately NOT autoscaled. AutoScale rescales to the window's own min/max,
; so a flat 2ms line gets amplified into a busy waveform that reads as network
; activity. A fixed ceiling makes flat look flat and spikes clip visibly.
[MeterLatCap]
Meter=String
MeterStyle=sMicro
X=#Pad#
Y=(248 - #BannerGap#)
Text="Latency"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterLatCapAux]
Meter=String
MeterStyle=sMicro
X=(#W# - #Pad#)
Y=(248 - #BannerGap#)
W=130
H=11
StringAlign=Right
StringCase=None
StringStyle=Normal
Text="this pc to #PingTarget#"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterJitterLabel]
Meter=String
MeterStyle=sLabel
X=#Pad#
Y=(262 - #BannerGap#)
Text="Jitter"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterJitterValue]
Meter=String
MeterStyle=sValue
MeasureName=MeasureJitter
X=(#W# - 104)
Y=(260 - #BannerGap#)
W=44
H=14
StringAlign=Right
FontSize=8.5
Text="%1 ms"
NumOfDecimals=1
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterLossLabel]
Meter=String
MeterStyle=sLabel
X=(#W# - 92)
Y=(262 - #BannerGap#)
W=48
