; =====================================================================
; InternetMonitor - dual WAN status
; =====================================================================
; Data model: the ROUTER is the source of truth for link state. It probes
; both WANs every 20s pinned to their own routing tables (probe-fibre /
; probe-lte), so it can say "fibre is down" while LTE carries traffic.
; This skin sits behind the router and can only ever see the active path,
; so it must never try to decide link state itself.
;
; net-health.json carries: fibre_state, lte_state, both_down, score,
; probe_ok/fail, worst_streak, fallthrough, endpoint_issue, held_s, hist.
;
; The h0..h19 per-slot keys were removed from the feed. The 20-minute
; history is read from the single packed "hist" string, which cut 20 regex
; capture groups and 439 lines of duplicated measures from this file.
;
; Layout rule: every row exists in every state. Values and colours change;
; nothing appears or disappears except the single banner slot. Captions sit
; ABOVE their data so the eye never reads a value before its label.
; =====================================================================

[Rainmeter]
Update=1000
AccurateText=1
MouseOverAction=[!SetVariable Expanded 1][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Expanded 0][!UpdateMeter *][!Redraw]

;---------------------------------------------------
; VARIABLES
;---------------------------------------------------
[Variables]
Expanded=0
; 1 when a banner condition is live. Visibility is (Expanded AND BannerOn),
; so a warning never spills out of the 86px collapsed panel.
BannerOn=0
; Rows below the banner shift up when it is not showing, so an empty
; banner slot never leaves a dead 30px gap under the headline.
BannerGap=30

HealthURL=http://192.168.88.210:5678/webhook/net-health.json
PingTarget=1.1.1.1

PingWarning=100
PingTimeout=3000
RetryWarn=10
; Latency graph ceiling in ms. Raise if your baseline is higher.
LatCeiling=25

; Palette - UniFi-ish: near-black panel, restrained accents
ColorText=238,241,246
ColorDim=138,146,161
; ColorFaint raised from 90,97,110: that failed WCAG AA at 3.03:1 on the
; 7pt bold micro style. 124,132,148 clears 4.5:1.
ColorFaint=124,132,148
ColorGood=64,214,133
ColorWarn=246,184,68
ColorBad=242,92,92
ColorRule=255,255,255,18
ColorPanel=15,17,22,238
ColorTrack=255,255,255,12
ColorFibre=104,184,255
ColorLte=198,142,255

; Geometry
W=236
Pad=14
Inner=208
HistY=(408 - #BannerGap#)
CellShape=Rectangle 0,0,8,7,1
DotShape=Ellipse 3,3,3

; Collapsed panel height / expanded panel height
HCollapsed=86
HExpanded=(444 - #BannerGap#)

;---------------------------------------------------
; STYLES
;---------------------------------------------------
[sMicro]
FontFace=Segoe UI
FontSize=7
FontColor=#ColorFaint#
StringCase=Upper
StringStyle=Bold
AntiAlias=1
ClipString=1

[sLabel]
FontFace=Segoe UI
FontSize=7.5
FontColor=#ColorDim#
StringCase=Upper
StringStyle=Bold
AntiAlias=1
ClipString=1

[sValue]
FontFace=Segoe UI
FontSize=9
FontColor=#ColorText#
AntiAlias=1
ClipString=1

[sStatus]
FontFace=Segoe UI
FontSize=10
FontWeight=600
FontColor=#ColorText#
AntiAlias=1
ClipString=1

[sWan]
FontFace=Segoe UI
FontSize=17
FontWeight=700
FontColor=#ColorFibre#
AntiAlias=1
ClipString=1

[sBanner]
FontFace=Segoe UI
FontSize=7.5
FontColor=#ColorText#
AntiAlias=1
ClipString=1

;---------------------------------------------------
; MEASURES - local path (this PC to #PingTarget#)
;---------------------------------------------------
; These measure THIS MACHINE's path, not the WAN. Labelled as such in the
; UI so they are never mistaken for link health.
[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
UpdateRate=2
DestAddress=#PingTarget#
Timeout=#PingTimeout#
IfCondition=(MeasurePing >= 0) && (MeasurePing < #PingWarning#)
IfTrueAction=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterStatus Text "Online"][!ShowMeter MeterPing][!HideMeter MeterPingNA][!SetOption MeterPing FontColor "#ColorDim#"]
IfCondition2=(MeasurePing >= #PingWarning#) && (MeasurePing < #PingTimeout#)
IfTrueAction2=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorWarn# | StrokeWidth 0"][!SetOption MeterStatus Text "Degraded"][!ShowMeter MeterPing][!HideMeter MeterPingNA][!SetOption MeterPing FontColor "#ColorWarn#"]
IfCondition3=(MeasurePing < 0) || (MeasurePing >= #PingTimeout#)
IfTrueAction3=[!SetOption MeterDot Shape "Ellipse 3.5,3.5,3.5 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterStatus Text "Offline"][!HideMeter MeterPing][!ShowMeter MeterPingNA]
DynamicVariables=1

; Previous ping sample. UpdateDivider=2 makes this lag MeasurePing by one
; cycle. It was 1, which read MeasurePing in the SAME cycle - the delta was
; almost always 0, which is why jitter permanently displayed 0.0 ms.
[MeasurePingPrev]
Measure=Calc
Formula=MeasurePing
UpdateDivider=2

[MeasureJitterRaw]
Measure=Calc
Formula=Abs(MeasurePing - MeasurePingPrev)
DynamicVariables=1

[MeasureJitter]
Measure=Calc
Formula=MeasureJitterRaw
AverageSize=20
DynamicVariables=1

[MeasureLossRaw]
Measure=Calc
Formula=(MeasurePing < 0 || MeasurePing >= #PingTimeout# ? 1 : 0)
DynamicVariables=1

[MeasureLoss]
Measure=Calc
Formula=MeasureLossRaw
AverageSize=60
MaxValue=60
Percentual=1
DynamicVariables=1

[MeasureNetIn]
Measure=NetIn
Interface=Best
AverageSize=3

[MeasureNetOut]
Measure=NetOut
Interface=Best
AverageSize=3

;---------------------------------------------------
; MEASURES - health feed (router + Pi-hole via n8n)
;---------------------------------------------------
; One regex, named fields, no positional h0..h19 chain. Additions to the
; JSON are tolerated; this only breaks if a key is renamed or removed.
[MeasureHealth]
Measure=Plugin
Plugin=WebParser
URL=#HealthURL#
RegExp=(?siU)"wan":"(.*)".*"fibre_state":"(.*)".*"lte_state":"(.*)".*"both_down":(.*),.*"score":(.*),.*"probe_ok":(.*),.*"probe_fail":(.*),.*"worst_streak":(.*),.*"fallthrough":(.*),.*"endpoint_issue":(.*),.*"held_s":(.*),.*"router_fresh":(.*),.*"dns_blocked_pct":(.*),.*"dns_retry_pct":(.*),.*"hist":"(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)"
UpdateRate=20
ForceReload=1

; --- 1: active WAN. Drives the headline, mark bar and history colours. ---
[MeasureWan]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=1
IfMatch=FIBRE
IfMatchAction=[!SetOption MeterWan Text "FIBRE"][!SetOption MeterWan FontColor "#ColorFibre#"][!SetOption MeterWanMark Shape "Rectangle 0,0,3,19,1.5 | Fill Color #ColorFibre# | StrokeWidth 0"][!SetOption MeterTpGraph LineColor "#ColorFibre#,200"]
IfMatch2=LTE
IfMatchAction2=[!SetOption MeterWan Text "LTE"][!SetOption MeterWan FontColor "#ColorLte#"][!SetOption MeterWanMark Shape "Rectangle 0,0,3,19,1.5 | Fill Color #ColorLte# | StrokeWidth 0"][!SetOption MeterTpGraph LineColor "#ColorLte#,200"]
IfMatch3=UNKNOWN
IfMatchAction3=[!SetOption MeterWan Text "WAN"][!SetOption MeterWan FontColor "#ColorFaint#"][!SetOption MeterWanMark Shape "Rectangle 0,0,3,19,1.5 | Fill Color #ColorFaint# | StrokeWidth 0"]

; --- 2: fibre link state. Genuine down state, from the router's own probe. ---
[MeasureFibreState]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=2
RegExpSubstitute=1
Substitute="^up$":"up","^down$":"down","^noip$":"no ip","^unknown$":"no data","^$":"no data"
IfMatch=^up$
IfMatchAction=[!SetOption MeterWan1Dot Shape "#DotShape# | Fill Color #ColorGood# | StrokeWidth 0"]
IfMatch2=^down$
IfMatchAction2=[!SetOption MeterWan1Dot Shape "#DotShape# | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterWan1State FontColor "#ColorBad#"][!UpdateMeter *][!Redraw]
IfMatch3=^unknown$
IfMatchAction3=[!SetOption MeterWan1Dot Shape "#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0"][!SetOption MeterWan1State FontColor "#ColorFaint#"]

; --- 3: LTE link state ---
[MeasureLteState]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=3
RegExpSubstitute=1
Substitute="^up$":"up","^down$":"down","^noip$":"no ip","^unknown$":"no data","^$":"no data"
IfMatch=^up$
IfMatchAction=[!SetOption MeterWan2Dot Shape "#DotShape# | Fill Color #ColorGood# | StrokeWidth 0"]
IfMatch2=^down$
IfMatchAction2=[!SetOption MeterWan2Dot Shape "#DotShape# | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterWan2State FontColor "#ColorBad#"][!UpdateMeter *][!Redraw]
IfMatch3=^(noip|unknown)$
IfMatchAction3=[!SetOption MeterWan2Dot Shape "#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0"][!SetOption MeterWan2State FontColor "#ColorFaint#"]

; --- which link is carrying traffic (active/standby) ---
; Separate from link state: a link can be up but not in use.
;
; This is a plain IfMatch on the WAN string, NOT a Calc reading a substituted
; measure. A WebParser Substitute produces a STRING, so a Calc formula pointed
; at it evaluates to 0 and no IfCondition ever fires - which is exactly why the
; state text sat on its default while the dots updated correctly.
;
; Order matters: this runs after MeasureFibreState/MeasureLteState, so a link
; that is genuinely down keeps its "down" text rather than being relabelled
; "standby" here. Down beats idle.
[MeasureActive]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=1
IfMatch=FIBRE
IfMatchAction=[!SetOption MeterWan1State FontColor "#ColorGood#"][!SetOption MeterWan2State FontColor "#ColorFaint#"][!UpdateMeasure MeasureFibreState][!UpdateMeasure MeasureLteState][!UpdateMeasure MeasureRouterFresh][!UpdateMeter *][!Redraw]
IfMatch2=LTE
IfMatchAction2=[!SetOption MeterWan1State FontColor "#ColorFaint#"][!SetOption MeterWan2State FontColor "#ColorLte#"][!UpdateMeasure MeasureFibreState][!UpdateMeasure MeasureLteState][!UpdateMeasure MeasureRouterFresh][!UpdateMeter *][!Redraw]

; --- 4: both_down. The banner's highest-priority state. ---
[MeasureBothDown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=4
RegExpSubstitute=1
Substitute="^true$":"1","^false$":"0","^$":"0"

; --- 5: score. Negative means fibre is losing probes. ---
[MeasureScore]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=5
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureScoreNum]
Measure=Calc
Formula=MeasureScore
DynamicVariables=1

; --- 6,7: lifetime probe counters -> success ratio ---
[MeasureProbeOk]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=6
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureProbeFail]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=7
RegExpSubstitute=1
Substitute="^$":"0"

; --- 8: worst consecutive failure streak ---
[MeasureWorst]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=8
RegExpSubstitute=1
Substitute="^$":"0"

; --- 9,10: fallthrough / endpoint_issue ---
; Failover needs EVERY probe target in a tick to fail, so one dead endpoint
; never causes a switch - the probe falls through to the next target and the
; tick still passes. That makes an endpoint outage invisible in the ok/fail
; counters. fallthrough counts exactly those ticks, and is the only signal
; that a provider is down while the line itself is healthy.
[MeasureFallthrough]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=9
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureEndpoint]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=10
RegExpSubstitute=1
Substitute="^true$":"1","^false$":"0","^$":"0"

; --- banner arbiter -------------------------------------------------
; Three conditions share one banner slot. Previously each raised it with
; its own IfMatchAction and only both_down could clear it, so the first
; warning latched the banner on forever - which left BannerGap at 0 and
; collapsed the 30px spacer every row below depends on.
;
; This decides the whole banner state every update, worst-first, and has
; an explicit false branch for every case. Never latches.
[MeasureBannerState]
Measure=Calc
Formula=(MeasureBothDownNum = 1 ? 3 : (MeasureEndpointNum = 1 ? 2 : (MeasureScoreNum < 0 ? 1 : 0)))
DynamicVariables=1
IfCondition=(MeasureBannerState = 3)
IfTrueAction=[!SetOption MeterBanner Text "Both links down. No failover possible."][!SetOption MeterBanner FontColor "#ColorBad#"][!SetOption MeterBannerBg Shape "Rectangle 0,0,#Inner#,26,4 | Fill Color 242,92,92,28 | StrokeWidth 1 | Stroke Color 242,92,92,70"][!SetVariable BannerOn 1][!SetVariable BannerGap 0][!UpdateMeter *][!Redraw][!SetOption MeterDurLabel Text "both down"][!SetOption MeterDurLabel FontColor "#ColorBad#"]
IfCondition2=(MeasureBannerState = 2)
IfTrueAction2=[!SetOption MeterBanner Text "Probe endpoint failing ([MeasureFallthrough]x). Line is fine."][!SetOption MeterBanner FontColor "#ColorWarn#"][!SetOption MeterBannerBg Shape "Rectangle 0,0,#Inner#,26,4 | Fill Color 246,184,68,22 | StrokeWidth 1 | Stroke Color 246,184,68,60"][!SetVariable BannerOn 1][!SetVariable BannerGap 0][!UpdateMeter *][!Redraw][!SetOption MeterDurLabel Text "probe issue"][!SetOption MeterDurLabel FontColor "#ColorWarn#"]
IfCondition3=(MeasureBannerState = 1)
IfTrueAction3=[!SetOption MeterBanner Text "Fibre losing probes (score [MeasureScore]). Not switched yet."][!SetOption MeterBanner FontColor "#ColorWarn#"][!SetOption MeterBannerBg Shape "Rectangle 0,0,#Inner#,26,4 | Fill Color 246,184,68,22 | StrokeWidth 1 | Stroke Color 246,184,68,60"][!SetVariable BannerOn 1][!SetVariable BannerGap 0][!UpdateMeter *][!Redraw][!SetOption MeterDurLabel Text "degraded"][!SetOption MeterDurLabel FontColor "#ColorWarn#"]
IfCondition4=(MeasureBannerState = 0)
IfTrueAction4=[!SetVariable BannerOn 0][!SetVariable BannerGap 30][!UpdateMeter *][!Redraw][!SetOption MeterDurLabel FontColor "#ColorFaint#"][!UpdateMeasure MeasureWanWord]

; Healthy-state wording only. Split from MeasureWan so the arbiter can
; refresh it without also re-running the headline/colour side-effects.
[MeasureWanWord]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=1
IfMatch=FIBRE
IfMatchAction=[!SetOption MeterDurLabel Text "stable"]
IfMatch2=LTE
IfMatchAction2=[!SetOption MeterDurLabel Text "on lte"]
IfMatch3=UNKNOWN
IfMatchAction3=[!SetOption MeterDurLabel Text "link"]

[MeasureBothDownNum]
Measure=Calc
Formula=MeasureBothDown
DynamicVariables=1

[MeasureEndpointNum]
Measure=Calc
Formula=MeasureEndpoint
DynamicVariables=1

; --- 11: seconds on the current link ---
[MeasureHeld]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=11
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureHeldNum]
Measure=Calc
Formula=MeasureHeld
DynamicVariables=1

; --- 12: router_fresh. False means the router stopped checking in. ---
[MeasureRouterFresh]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=12
IfMatch=false
IfMatchAction=[!SetOption MeterWan1State FontColor "#ColorFaint#"][!SetOption MeterWan2State FontColor "#ColorFaint#"][!SetOption MeterWan1Dot Shape "#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0"][!SetOption MeterWan2Dot Shape "#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0"]

; --- 13,14: DNS ---
[MeasureDnsBlocked]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=13

[MeasureDnsRetry]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=14
RegExpSubstitute=1
Substitute="^$":"0"

[MeasureDnsRetryNum]
Measure=Calc
Formula=MeasureDnsRetry
UpdateDivider=20
DynamicVariables=1
IfCondition=MeasureDnsRetryNum >= #RetryWarn#
IfTrueAction=[!SetOption MeterDnsRetryValue FontColor "#ColorWarn#"]
IfCondition2=MeasureDnsRetryNum < #RetryWarn#
IfTrueAction2=[!SetOption MeterDnsRetryValue FontColor "#ColorGood#"]

; --- 15: packed 20-char history, one char per minute ---
; F=fibre L=lte X=down .=no data. Each cell reads one character via its own
; RegExp2 offset. This replaces 20 WebParser measures with 4 IfMatch rules
; each (80 rules, 80 redraws) that previously consumed 439 lines.
[MeasureHist]
Measure=Plugin
Plugin=WebParser
URL=[MeasureHealth]
StringIndex=15

;---------------------------------------------------
; METERS - panel
;---------------------------------------------------
[MeterPanel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#W#,(#Expanded# = 1 ? #HExpanded# : #HCollapsed#),9 | Fill Color #ColorPanel# | StrokeWidth 1 | Stroke Color #ColorRule#
DynamicVariables=1

;---------------------------------------------------
; METERS - always visible (collapsed)
;---------------------------------------------------
[MeterDot]
Meter=Shape
X=#Pad#
Y=17
Shape=Ellipse 3.5,3.5,3.5 | Fill Color #ColorFaint# | StrokeWidth 0
DynamicVariables=1

[MeterStatus]
Meter=String
MeterStyle=sStatus
X=11r
Y=-7r
W=110
H=16
Text="Checking"
DynamicVariables=1

[MeterPing]
Meter=String
MeterStyle=sValue
MeasureName=MeasurePing
X=(#W# - #Pad#)
Y=13
W=80
H=16
StringAlign=Right
FontColor=#ColorDim#
Text="%1 ms"
NumOfDecimals=0
DynamicVariables=1

[MeterPingNA]
Meter=String
MeterStyle=sValue
X=(#W# - #Pad#)
Y=13
W=80
H=16
StringAlign=Right
FontColor=#ColorBad#
Text="no reply"
Hidden=1
DynamicVariables=1

[MeterWanMark]
Meter=Shape
X=#Pad#
Y=45
Shape=Rectangle 0,0,3,19,1.5 | Fill Color #ColorFaint# | StrokeWidth 0
DynamicVariables=1

[MeterWan]
Meter=String
MeterStyle=sWan
X=10r
Y=-5r
W=120
H=25
Text="WAN"
DynamicVariables=1

; Duration on the current link. This is the one figure that changes a
; decision (wait, or go look at the router), so it earns the right-hand slot.
[MeterDurLabel]
Meter=String
MeterStyle=sMicro
X=(#W# - #Pad#)
Y=43
W=100
H=11
StringAlign=Right
Text="link"
DynamicVariables=1

[MeterDurValue]
Meter=String
MeterStyle=sLabel
MeasureName=MeasureHeldNum
X=(#W# - #Pad#)
Y=55
W=100
H=13
StringAlign=Right
FontColor=#ColorDim#
StringCase=None
Text="%1"
NumOfDecimals=0
Format="%2.0f s"
DynamicVariables=1

;---------------------------------------------------
; METERS - banner (the only conditional element)
;---------------------------------------------------
[MeterBannerBg]
Meter=Shape
X=#Pad#
Y=118
Shape=Rectangle 0,0,#Inner#,24,4 | Fill Color 246,184,68,22 | StrokeWidth 1 | Stroke Color 246,184,68,60
Hidden=((#Expanded# = 1) && (#BannerOn# = 1) ? 0 : 1)
DynamicVariables=1

[MeterBanner]
Meter=String
MeterStyle=sBanner
X=(#Pad# + 8)
Y=124
W=(#Inner# - 16)
H=16
ClipString=1
Text=""
Hidden=((#Expanded# = 1) && (#BannerOn# = 1) ? 0 : 1)
DynamicVariables=1

;---------------------------------------------------
; METERS - expanded
;---------------------------------------------------
[MeterRule1]
Meter=Shape
X=#Pad#
Y=110
Shape=Rectangle 0,0,#Inner#,1 | Fill Color #ColorRule# | StrokeWidth 0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterLinksCap]
Meter=String
MeterStyle=sMicro
X=#Pad#
Y=(150 - #BannerGap#)
Text="Links"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan1Dot]
Meter=Shape
X=#Pad#
Y=(166 - #BannerGap#)
Shape=#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan1Name]
Meter=String
MeterStyle=sValue
X=12r
Y=-5r
W=90
H=14
FontSize=8.5
Text="fibre"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan1State]
Meter=String
MeterStyle=sLabel
X=(#W# - #Pad#)
Y=(163 - #BannerGap#)
W=90
H=13
StringAlign=Right
FontColor=#ColorFaint#
MeasureName=MeasureFibreState
Text="%1"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan2Dot]
Meter=Shape
X=#Pad#
Y=(184 - #BannerGap#)
Shape=#DotShape# | Fill Color #ColorFaint# | StrokeWidth 0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan2Name]
Meter=String
MeterStyle=sValue
X=12r
Y=-5r
W=90
H=14
FontSize=8.5
Text="lte"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterWan2State]
Meter=String
MeterStyle=sLabel
X=(#W# - #Pad#)
Y=(181 - #BannerGap#)
W=90
H=13
StringAlign=Right
FontColor=#ColorFaint#
MeasureName=MeasureLteState
Text="%1"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

; --- probe health: the router's WAN truth ---
[MeterProbeCap]
Meter=String
MeterStyle=sMicro
X=#Pad#
Y=(202 - #BannerGap#)
Text="Probe health"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterProbeCapAux]
Meter=String
MeterStyle=sMicro
X=(#W# - #Pad#)
Y=(202 - #BannerGap#)
W=120
H=11
StringAlign=Right
StringCase=None
StringStyle=Normal
Text="router, both wans"
