[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

;---------------------------------------------------
; VARIABLES
;---------------------------------------------------
[Variables]
Expanded=0
ConnectionState=1

; Thresholds
PingGood=50
PingWarning=100
PingBad=200
PingTimeout=3000

; Colors
ColorGood=00FF00
ColorWarning=FFA500
ColorBad=FF0000
ColorText=FFFFFF
ColorCyan=00FFFF
ColorBackground=0,0,0,180

; Dimensions
Width=240
HeightCollapsed=65
HeightExpanded=165

;---------------------------------------------------
; STYLES
;---------------------------------------------------
[StyleText]
FontFace=Segoe UI
FontSize=11
FontColor=#ColorText#
StringAlign=Left
StringStyle=Normal
AntiAlias=1
ClipString=0

[StyleTextBold]
FontFace=Segoe UI
FontSize=11
FontWeight=600
FontColor=#ColorText#
StringAlign=Left
AntiAlias=1
ClipString=0

[StyleTextSmall]
FontFace=Segoe UI
FontSize=9
FontColor=#ColorText#,200
StringAlign=Left
AntiAlias=1
ClipString=0

[StyleTextCyan]
FontFace=Segoe UI
FontSize=9
FontColor=#ColorCyan#
StringAlign=Left
AntiAlias=1
ClipString=0

;---------------------------------------------------
; MEASURES - CONNECTION
;---------------------------------------------------
[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
UpdateRate=1
DestAddress=8.8.8.8
Timeout=#PingTimeout#
DynamicVariables=1

[MeasurePingStatus]
Measure=Calc
Formula=MeasurePing
IfCondition=(MeasurePing < 0) || (MeasurePing >= #PingTimeout#)
IfTrueAction=[!SetOption MeterStatusDot Shape "Ellipse 5,5,5 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterStatusText Text "Disconnected"][!SetOption MeterStatusDot ToolTipText "Click to Connect"][!SetOption MeterPingValue Text "N/A"][!SetVariable ConnectionState 0][!UpdateMeter *][!Redraw]
IfCondition2=(MeasurePing >= 0) && (MeasurePing <= #PingGood#)
IfTrueAction2=[!SetOption MeterStatusDot Shape "Ellipse 5,5,5 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterStatusText Text "Connected"][!SetOption MeterStatusDot ToolTipText "Click to Disconnect"][!SetOption MeterPingValue Text "[MeasurePing]ms"][!SetVariable ConnectionState 1][!UpdateMeter *][!Redraw]
IfCondition3=(MeasurePing > #PingGood#) && (MeasurePing <= #PingWarning#)
IfTrueAction3=[!SetOption MeterStatusDot Shape "Ellipse 5,5,5 | Fill Color #ColorWarning# | StrokeWidth 0"][!SetOption MeterStatusText Text "Connected"][!SetOption MeterStatusDot ToolTipText "Click to Disconnect"][!SetOption MeterPingValue Text "[MeasurePing]ms"][!SetVariable ConnectionState 1][!UpdateMeter *][!Redraw]
IfCondition4=(MeasurePing > #PingWarning#) && (MeasurePing < #PingTimeout#)
IfTrueAction4=[!SetOption MeterStatusDot Shape "Ellipse 5,5,5 | Fill Color #ColorBad# | StrokeWidth 0"][!SetOption MeterStatusText Text "Disconnected"][!SetOption MeterStatusDot ToolTipText "Click to Connect"][!SetOption MeterPingValue Text "[MeasurePing]ms"][!SetVariable ConnectionState 0][!UpdateMeter *][!Redraw]
DynamicVariables=1

;---------------------------------------------------
; MEASURES - PACKET LOSS
;---------------------------------------------------
[MeasurePacketLossRaw]
Measure=Calc
Formula=(MeasurePing < 0 || MeasurePing >= #PingTimeout# ? 1 : 0)
DynamicVariables=1

[MeasurePacketLoss]
Measure=Calc
Formula=MeasurePacketLossRaw
AverageSize=20
MaxValue=20
Percentual=1
DynamicVariables=1

;---------------------------------------------------
; MEASURES - BANDWIDTH
;---------------------------------------------------
[MeasureNetIn]
Measure=NetIn
Interface=Best
AverageSize=3

[MeasureNetOut]
Measure=NetOut
Interface=Best
AverageSize=3

;---------------------------------------------------
; MEASURES - BATCH FILE EXECUTION
;---------------------------------------------------
[RunInternetBatchFile]
Measure=Plugin
Plugin=RunCommand
Parameter="#CURRENTPATH#InternetController.bat"
OutputType=ANSI
State=Hide

;---------------------------------------------------
; METERS - HEADER
;---------------------------------------------------
[MeterTitle]
Meter=String
MeterStyle=StyleTextBold
X=15
Y=10
W=(#Width# - 30)
H=20
Text="Network Monitor"
MouseOverAction=[!SetVariable Expanded 1][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetVariable Expanded 0][!UpdateMeter *][!Redraw]

[MeterStatusDot]
Meter=Shape
X=15
Y=38
Shape=Ellipse 5,5,5 | Fill Color #ColorGood# | StrokeWidth 0
ToolTipText="Click to Disconnect"
LeftMouseUpAction=[!CommandMeasure "RunInternetBatchFile" "Run"]
DynamicVariables=1

[MeterStatusText]
Meter=String
MeterStyle=StyleText
X=30
Y=35
W=100
H=16
Text="Connected"
DynamicVariables=1

;---------------------------------------------------
; METERS - PING DISPLAY
;---------------------------------------------------
[MeterPingLabel]
Meter=String
MeterStyle=StyleTextCyan
X=136
Y=37
Text="Ping:"

[MeterPingValue]
Meter=String
MeterStyle=StyleText
X=170
Y=35
W=60
H=16
Text="0ms"
ClipString=0
DynamicVariables=1

;---------------------------------------------------
; METERS - EXPANDED SECTION
;---------------------------------------------------
[MeterDivider]
Meter=Shape
X=15
Y=60
W=(#Width# - 30)
H=1
Shape=Rectangle 0,0,(#Width# - 30),1 | Fill Color 255,255,255,30 | StrokeWidth 0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterPingGraph]
Meter=Line
MeasureName=MeasurePing
X=15
Y=68
W=(#Width# - 30)
H=35
LineColor=#ColorCyan#,200
LineWidth=2
AntiAlias=1
GraphStart=Left
AutoScale=1
MinValue=0
MaxValue=#PingBad#
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

; Download
[MeterDownloadLabel]
Meter=String
MeterStyle=StyleTextCyan
X=10
Y=112
Text="DN:"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterDownloadValue]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureNetIn
X=40
Y=110
W=190
H=16
Text="%1B/s"
AutoScale=1
NumOfDecimals=2
StringAlign=Left
ClipString=0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

; Upload
[MeterUploadLabel]
Meter=String
MeterStyle=StyleTextCyan
X=10
Y=130
Text="UP:"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterUploadValue]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureNetOut
X=40
Y=128
W=190
H=16
Text="%1B/s"
AutoScale=1
NumOfDecimals=2
StringAlign=Left
ClipString=0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

; Packet Loss
[MeterPacketLossLabel]
Meter=String
MeterStyle=StyleTextCyan
X=10
Y=148
Text="Packet Loss:"
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1

[MeterPacketLossValue]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePacketLoss
X=90
Y=146
W=140
H=16
Text="%1%"
Percentual=1
NumOfDecimals=1
StringAlign=Left
ClipString=0
Hidden=(#Expanded# = 0 ? 1 : 0)
DynamicVariables=1