[Rainmeter]
DynamicWindowSize=1
Update=50
BackgroundMode=3
BackgroundMargins=0,34,0,14

;---------------------------------------------------
; VARIABLES - Edit these to match your setup
;---------------------------------------------------
[Variables]

; Device 1 - IP address and display name
Device1IP=192.168.1.100
Device1Name=Server 1

; Device 2 - IP address and display name
Device2IP=192.168.1.101
Device2Name=Server 2

; Font - change to any font installed on your system
FontName=Segoe UI

; Ping timeout in milliseconds (default: 1000ms = 1 second)
PingTimeout=1000

;---------------------------------------------------
; STYLE
;---------------------------------------------------
[Style]
FontFace=#FontName#
FontSize=12
FontColor=FFFFFF
StringAlign=Left
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=000000
AntiAlias=1

;---------------------------------------------------
; MEASURES - Device 1
;---------------------------------------------------
[MeasureConnectionDevice1]
Measure=Plugin
Plugin=Plugins\PingPlugin
UpdateRate=1000
DestAddress=#Device1IP#
Timeout=#PingTimeout#
IfBelowValue=#PingTimeout#
IfBelowAction=[!SetOption MeterStatusImageDevice1 ImageName Online.png][!UpdateMeter MeterStatusImageDevice1][!Redraw]
IfAboveValue=#PingTimeout#
IfAboveAction=[!SetOption MeterStatusImageDevice1 ImageName Offline.png][!UpdateMeter MeterStatusImageDevice1][!Redraw]
DynamicVariables=1

;---------------------------------------------------
; MEASURES - Device 2
;---------------------------------------------------
[MeasureConnectionDevice2]
Measure=Plugin
Plugin=Plugins\PingPlugin
UpdateRate=1000
DestAddress=#Device2IP#
Timeout=#PingTimeout#
IfBelowValue=#PingTimeout#
IfBelowAction=[!SetOption MeterStatusImageDevice2 ImageName Online.png][!UpdateMeter MeterStatusImageDevice2][!Redraw]
IfAboveValue=#PingTimeout#
IfAboveAction=[!SetOption MeterStatusImageDevice2 ImageName Offline.png][!UpdateMeter MeterStatusImageDevice2][!Redraw]
DynamicVariables=1

;---------------------------------------------------
; METERS - Device 1
;---------------------------------------------------
[MeterStatusImageDevice1]
Meter=Image
W=10
H=10
X=13
Y=15

[MeterTitleDevice1]
Meter=String
MeterStyle=Style
X=28
Y=8
W=140
H=18
Text=#Device1Name#
DynamicVariables=1

;---------------------------------------------------
; METERS - Device 2
;---------------------------------------------------
[MeterStatusImageDevice2]
Meter=Image
W=10
H=10
X=13
Y=37

[MeterTitleDevice2]
Meter=String
MeterStyle=Style
X=28
Y=30
W=90
H=18
Text=#Device2Name#
DynamicVariables=1
